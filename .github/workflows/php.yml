name: Lite CI

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lite-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run static checks
        run: |
          sh -n docker/entrypoint.sh
          bash -n scripts/lite-smoke-test.sh
          node --check lite/assets/app.js
          docker compose config --quiet

      - name: Build Lite image
        run: docker build --tag easyimage:ci .

      - name: Lint Lite PHP
        run: >-
          docker run --rm --entrypoint sh easyimage:ci -c
          'find /var/www/html/lite -type f -name "*.php" -exec php -l {} \;'

      - name: Run Lite smoke test
        run: bash scripts/lite-smoke-test.sh easyimage:ci
